<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güneş AI Ultra - Dev Güvenlikli Asistan</title>
    
    <!-- Dış Kütüphaneler -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-dark: #020617;
            --card-bg: rgba(15, 23, 42, 0.9);
            --card-border: rgba(56, 189, 248, 0.35);
            --user-bubble: linear-gradient(135deg, #2563eb, #1d4ed8);
            --bot-bubble: rgba(30, 41, 59, 0.95);
            --accent-cyan: #38bdf8;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --glow-color: rgba(56, 189, 248, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        /* Arka Plan Neon Efektleri */
        .bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px);
            background-size: 28px 28px;
            z-index: 0;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            z-index: 0;
            opacity: 0.5;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        .blob-1 { width: 500px; height: 500px; background: #38bdf8; top: -10%; left: -10%; }
        .blob-2 { width: 550px; height: 550px; background: #7c3aed; bottom: -15%; right: -10%; animation-delay: -4s; }

        @keyframes pulseGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 20px) scale(1.08); }
        }

        /* Ana Konteyner */
        .chat-container {
            position: relative;
            z-index: 10;
            max-width: 1150px;
            width: 100%;
            height: 96vh;
            background: var(--card-bg);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.95), 0 0 40px var(--glow-color);
            overflow: hidden;
        }

        /* Üst Header */
        .chat-header {
            padding: 16px 24px;
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .bot-brand { display: flex; align-items: center; gap: 14px; }

        .avatar-glow {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 20px var(--glow-color);
        }

        .bot-brand h2 { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
        .status-badge { font-size: 13px; color: var(--accent-green); display: flex; align-items: center; gap: 6px; font-weight: 600; margin-top: 2px; }
        .status-dot { width: 8px; height: 8px; background-color: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); }

        .header-btns { display: flex; gap: 8px; align-items: center; }

        .mode-select {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 9px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .mode-select option { background: #0f172a; color: #fff; }

        .icon-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 9px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }

        .icon-btn:hover { background: rgba(56, 189, 248, 0.2); border-color: var(--accent-cyan); }

        /* Chat Akış Alanı */
        #chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .msg-row {
            display: flex;
            gap: 14px;
            max-width: 88%;
            animation: fadeIn 0.15s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user-row { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot-row { align-self: flex-start; }

        .msg-avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .user-row .msg-avatar { background: var(--user-bubble); color: white; }
        .bot-row .msg-avatar { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid var(--card-border); }

        .msg-content {
            padding: 15px 18px;
            border-radius: 18px;
            line-height: 1.65;
            font-size: 15px;
            word-wrap: break-word;
            user-select: text;
        }

        .user-row .msg-content {
            background: var(--user-bubble);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .bot-row .msg-content {
            background-color: var(--bot-bubble);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .msg-content p { margin-bottom: 8px; }
        .msg-content p:last-child { margin-bottom: 0; }
        .msg-content h1, .msg-content h2, .msg-content h3 { margin: 12px 0 6px 0; color: var(--accent-cyan); }
        .msg-content ul, .msg-content ol { margin-left: 18px; margin-bottom: 8px; }
        .msg-content code { font-family: 'Fira Code', monospace; background: rgba(0,0,0,0.5); padding: 3px 6px; border-radius: 6px; font-size: 13px; color: #f472b6; }
        
        .code-wrapper {
            position: relative;
            margin: 12px 0;
            border-radius: 10px;
            overflow: hidden;
            background: #181825;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        
        .code-wrapper pre { margin: 0; padding: 14px; overflow-x: auto; font-family: 'Fira Code', monospace; }
        .code-wrapper code { background: transparent; padding: 0; color: inherit; }
        
        .copy-code-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .copy-code-btn:hover { background: var(--accent-cyan); color: #000; }

        /* Hızlı Butonlar Barı */
        .chips-bar {
            display: flex;
            gap: 10px;
            padding: 0 24px 12px 24px;
            overflow-x: auto;
        }

        .chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 7px 14px;
            border-radius: 18px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .chip:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.15);
            transform: translateY(-2px);
        }

        /* Mesaj Giriş Alanı */
        #input-area {
            display: flex;
            gap: 12px;
            padding: 16px 24px;
            background: rgba(11, 15, 25, 0.95);
            border-top: 1px solid var(--card-border);
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background-color: rgba(30, 41, 59, 0.7);
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
            user-select: text;
        }

        input[type="text"]:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px var(--glow-color);
            background-color: rgba(30, 41, 59, 0.95);
        }

        button.send-btn {
            padding: 0 26px;
            height: 52px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--accent-cyan), #2563eb);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        button.send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="bot-brand">
                <div class="avatar-glow"><i class="fa-solid fa-bolt-lightning"></i></div>
                <div>
                    <h2>Güneş AI Ultra</h2>
                    <span class="status-badge"><span class="status-dot"></span> Güvenli Motor • Yusuf Can Güneş</span>
                </div>
            </div>
            <div class="header-btns">
                <select id="ai-mode" class="mode-select" title="Çalışma Modu Seçin">
                    <option value="turbo">⚡ Turbo Mod (Işık Hızı)</option>
                    <option value="coder">💻 Kod Modu (Mimar & Güvenlik)</option>
                    <option value="security">🛡️ Siber Güvenlik Modu</option>
                </select>
                <button class="icon-btn" onclick="exportChat()"><i class="fa-solid fa-download"></i> Kaydet</button>
                <button class="icon-btn" onclick="clearChat()"><i class="fa-solid fa-trash-can"></i> Temizle</button>
            </div>
        </div>

        <!-- Chat Akışı -->
        <div id="chat-box">
            <div class="msg-row bot-row">
                <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="msg-content">Naber kanka! Ben <b>Güneş AI Ultra</b>. Yapımcım <b>Yusuf Can Güneş</b>. İstediğin modu seçip mesajını atabilirsin! 🚀</div>
            </div>
        </div>

        <!-- Hızlı Öneri Butonları -->
        <div class="chips-bar">
            <div class="chip" onclick="sendQuick('Seni kim üretti?')">👑 Seni Kim Üretti?</div>
            <div class="chip" onclick="sendQuick('Bana HTML, CSS ve JS ile gelişmiş bir Yılan Oyunu yaz')">🎮 Yılan Oyunu Kodu</div>
            <div class="chip" onclick="sendQuick('Bir web sitesinde SQL Injection zafiyeti nasıl önlenir?')">🛡️ Güvenlik Zafiyeti Önleme</div>
            <div class="chip" onclick="sendQuick('Python ile hızlı bir dosya şifreleyici yaz')">🔐 Şifreleme Algoritması</div>
        </div>

        <!-- Alt Giriş Barı -->
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Aklındakini yaz, anında yanıtlayayım..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i> Gönder</button>
        </div>
    </div>

    <script>
        let chatHistory = [];

        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            }
        });

        window.onload = () => {
            const savedHistory = localStorage.getItem('gunes_ai_dev_history');
            if (savedHistory) {
                try {
                    chatHistory = JSON.parse(savedHistory);
                    renderSavedChat();
                } catch (e) {
                    chatHistory = [];
                }
            }
        };

        function sendQuick(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        function clearChat() {
            chatHistory = [];
            localStorage.removeItem('gunes_ai_dev_history');
            document.getElementById('chat-box').innerHTML = `
                <div class="msg-row bot-row">
                    <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-content">Sohbet sıfırlandı! Yeni sorunu sorabilirsin kanka. ⚡</div>
                </div>`;
        }

        function exportChat() {
            if (chatHistory.length === 0) {
                alert("Henüz kaydedilecek bir sohbet yok!");
                return;
            }
            let textContent = "--- Güneş AI Ultra Sohbet Geçmişi ---\n\n";
            chatHistory.forEach(msg => {
                textContent += `[${msg.role === 'user' ? 'Kullanıcı' : 'Güneş AI'}]:\n${msg.content}\n\n`;
            });

            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Gunes_AI_Sohbet_${Date.now()}.txt`;
            a.click();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-box');

            // Kullanıcı Mesajı
            chatBox.innerHTML += `
                <div class="msg-row user-row">
                    <div class="msg-avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="msg-content">${escapeHtml(message)}</div>
                </div>`;

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            chatHistory.push({ role: "user", content: message });
            saveChatHistory();

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div class="msg-row bot-row" id="${loadingId}">
                    <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-content"><i><i class="fa-solid fa-bolt fa-spin"></i> Düşünüyor...</i></div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            // Mod Seçimi
            const selectedMode = document.getElementById('ai-mode').value;
            let systemPrompt = "";
            
            if (selectedMode === 'turbo') {
                systemPrompt = "Sen Güneş AI Ultra adında süper hızlı, keskin ve doğrudan yanıt veren bir asistansın. Seni YUSUF CAN GÜNEŞ üretti. Seni kim üretti sorusuna gururla 'Yusuf Can Güneş' cevabını ver. Yanıtları doğrudan, zaman kaybettirmeden, kısa ve net ver. Türkçe konuş.";
            } else if (selectedMode === 'coder') {
                systemPrompt = "Sen Güneş AI Ultra adında kıdemli bir yazılım mimarısın. Seni YUSUF CAN GÜNEŞ üretti. Kodları eksiksiz, temiz, güvenlik standartlarına uygun ve yorum satırlarıyla yaz. Hataları anında tespit et.";
            } else if (selectedMode === 'security') {
                systemPrompt = "Sen Güneş AI Ultra adında kıdemli bir Siber Güvenlik Uzmanısın. Seni YUSUF CAN GÜNEŞ üretti. Güvenlik zafiyetleri, şifreleme, ağ analizi ve güvenli sistem tasarımı konularında derin, açıklayıcı ve teknik yanıtlar ver.";
            }

            try {
                // Güvenli POST İstek Yapısı (CORS & AdBlock Koruma Dahil)
                const response = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: systemPrompt },
                            ...chatHistory.slice(-8)
                        ],
                        model: "openai"
                    })
                });

                if (!response.ok) throw new Error("Ağ yanıtı başarısız");

                const botReply = await response.text();

                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                chatBox.innerHTML += `
                    <div class="msg-row bot-row">
                        <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                        <div class="msg-content">${renderMarkdown(botReply)}</div>
                    </div>`;

                chatHistory.push({ role: "assistant", content: botReply });
                saveChatHistory();
                applyCodeBlocks();

            } catch (err) {
                // Yedek GET Bağlantısı (POST Engellenirse Çalışır)
                try {
                    const fallbackUrl = `https://text.pollinations.ai/${encodeURIComponent(systemPrompt + "\n\nKullanıcı: " + message)}?model=openai`;
                    const fallbackRes = await fetch(fallbackUrl);
                    const botReply = await fallbackRes.text();

                    const loadingElement = document.getElementById(loadingId);
                    if (loadingElement) loadingElement.remove();

                    chatBox.innerHTML += `
                        <div class="msg-row bot-row">
                            <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                            <div class="msg-content">${renderMarkdown(botReply)}</div>
                        </div>`;

                    chatHistory.push({ role: "assistant", content: botReply });
                    saveChatHistory();
                    applyCodeBlocks();
                } catch (fallbackErr) {
                    const loadingElement = document.getElementById(loadingId);
                    if (loadingElement) loadingElement.remove();

                    chatBox.innerHTML += `
                        <div class="msg-row bot-row">
                            <div class="msg-avatar"><i class="fa-solid fa-triangle-exclamation"></i></div>
                            <div class="msg-content">Bağlantı engellendi! Lütfen internet bağlantını veya AdBlock/Eklentilerini kontrol edip tekrar dene kanka.</div>
                        </div>`;
                }
            } finally {
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function renderMarkdown(text) {
            return marked.parse(text);
        }

        function applyCodeBlocks() {
            document.querySelectorAll('pre code').forEach((block) => {
                if (!block.parentElement.classList.contains('code-wrapper')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'code-wrapper';

                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-code-btn';
                    copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Kopyala';
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(block.innerText);
                        copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Kopyalandı!';
                        setTimeout(() => copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Kopyala', 2000);
                    };

                    block.parentElement.parentNode.insertBefore(wrapper, block.parentElement);
                    wrapper.appendChild(copyBtn);
                    wrapper.appendChild(block.parentElement);
                    hljs.highlightElement(block);
                }
            });
        }

        function saveChatHistory() {
            if (chatHistory.length > 20) chatHistory = chatHistory.slice(chatHistory.length - 20);
            localStorage.setItem('gunes_ai_dev_history', JSON.stringify(chatHistory));
        }

        function renderSavedChat() {
            const chatBox = document.getElementById('chat-box');
            chatHistory.forEach(msg => {
                if (msg.role === 'user') {
                    chatBox.innerHTML += `
                        <div class="msg-row user-row">
                            <div class="msg-avatar"><i class="fa-solid fa-user"></i></div>
                            <div class="msg-content">${escapeHtml(msg.content)}</div>
                        </div>`;
                } else {
                    chatBox.innerHTML += `
                        <div class="msg-row bot-row">
                            <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                            <div class="msg-content">${renderMarkdown(msg.content)}</div>
                        </div>`;
                }
            });
            applyCodeBlocks();
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
