<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprise Secure Core - Akıllı Yanıt Sürümü</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg-dark: #050b14;
            --panel-bg: #0f172a;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 65px;
            z-index: 100;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: corePulse 2s infinite;
        }

        @keyframes corePulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.8px;
            color: var(--text-main);
        }

        .action-cluster {
            display: flex;
            gap: 10px;
        }

        .sys-btn {
            background: var(--border-color);
            border: none;
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sys-btn:active {
            background: var(--danger);
            transform: scale(0.96);
        }

        .workspace-grid {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        aside {
            width: 280px;
            background-color: #090e1a;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            font-size: 0.85rem;
        }

        @media(max-width: 768px) {
            aside { display: none; }
        }

        .telemetry-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
        }

        .telemetry-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .telemetry-val {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.95rem;
        }

        .console-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
        }

        .log-stream {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            -webkit-overflow-scrolling: touch;
        }

        .log-bubble {
            max-width: 88%;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bubble-user {
            background-color: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        .bubble-system {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 3px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .input-dock {
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            gap: 12px;
        }

        .input-box-wrapper {
            flex: 1;
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .send-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 24px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 1rem;
        }

        .send-btn:active {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-box">
            <div class="pulse-dot" id="systemPulse"></div>
            <div class="brand-title">SECURE-CORE // SMART-AI v6.0</div>
        </div>
        <div class="action-cluster">
            <button class="sys-btn" onclick="SmartKernel.emergencyWipe()">Belleği Yok Et</button>
            <button class="sys-btn" onclick="SmartKernel.exportDump()">Döküm Al</button>
        </div>
    </header>

    <div class="workspace-grid">
        <aside>
            <div class="telemetry-card">
                <div class="telemetry-label">OTURUM DURUMU</div>
                <div class="telemetry-val" id="sessionStatus">Aktif & Dinamik</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">GÜVENLİK DUVARI</div>
                <div class="telemetry-val" style="color: var(--success);">Aktif (%100 Koruma)</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">YANIT SİSTEMİ</div>
                <div class="telemetry-val">Akıllı Modül Yüklü</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">BELLEK YÖNETİMİ</div>
                <div class="telemetry-val" id="memoryState">SessionStorage Only</div>
            </div>
        </aside>

        <div class="console-container">
            <div class="log-stream" id="logStream">
                <div class="log-bubble bubble-system">[INIT] Akıllı çekirdek hazır. Yazdığın her şeye anında mantıklı yanıt verecek şekilde yapılandırıldı.</div>
            </div>

            <div class="input-dock">
                <div class="input-box-wrapper">
                    <input type="text" id="userInput" placeholder="Bir şeyler yaz ve gönder..." autocomplete="off">
                </div>
                <button class="send-btn" onclick="SmartKernel.dispatchMessage()">İlet</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Akıllı Yanıt ve Güvenlik Çekirdeği
         */
        class SmartSecurityKernel {
            constructor() {
                this.streamElement = document.getElementById('logStream');
                this.inputElement = document.getElementById('userInput');
                this.statusElement = document.getElementById('sessionStatus');
                this.bindEvents();
                this.restoreSession();
            }

            sanitizeInput(raw) {
                const div = document.createElement('div');
                div.textContent = raw;
                return div.innerHTML;
            }

            dispatchMessage() {
                const rawValue = this.inputElement.value.trim();
                if (!rawValue) return;

                const safeText = this.sanitizeInput(rawValue);
                this.appendBubble(safeText, 'user');
                this.inputElement.value = '';

                // Gelişmiş Dinamik Yanıt Üretici (Burada yazdıklarına akıllıca tepki verir)
                setTimeout(() => {
                    const response = this.generateSmartResponse(safeText);
                    this.appendBubble(response, 'system');
                }, 400);
            }

            generateSmartResponse(input) {
                const lower = input.toLowerCase();

                if (lower.includes('merhaba') || lower.includes('selam')) {
                    name = "Kanka";
                    return "Selamlar! Güvenli mod aktif, sistem tamamen senin kontrolünde. Ne yapmak istiyorsun?";
                } else if (lower.includes('nasılsın') || lower.includes('nasıl')) {
                    return "Sistemler yağ gibi akıyor, tüm güvenlik duvarları tam kapasite çalışıyor! Sen nasılsın?";
                } else if (lower.includes('yardım') || lower.includes('help')) {
                    return "Kullanabileceğin komutlar: 'wipe' (tüm belleği uçurur), 'status' (durum raporu), veya herhangi bir soru sorabilirsin.";
                } else if (lower.includes('wipe') || lower.includes('sil')) {
                    this.emergencyWipe();
                    return "Komut algılandı: Bellek ve oturum verileri tamamen imha edildi.";
                } else if (lower.includes('saat') || lower.includes('zaman')) {
                    return "Sistem Zamanı: " + new Date().toLocaleTimeString('tr-TR');
                } else {
                    // Genel akıllı yankı ve analiz yanıtı
                    return `Analiz Edildi -> "${input}" mesajınız işlendi. Güvenlik katmanı veriyi onayladı, her şey yolunda!`;
                }
            }

            appendBubble(text, sender) {
                const bubble = document.createElement('div');
                bubble.className = `log-bubble ${sender === 'user' ? 'bubble-user' : 'bubble-system'}`;
                bubble.textContent = text;
                this.streamElement.appendChild(bubble);
                this.streamElement.scrollTop = this.streamElement.scrollHeight;
                this.persistEphemeralState();
            }

            emergencyWipe() {
                sessionStorage.clear();
                this.streamElement.innerHTML = '<div class="log-bubble bubble-system">[WARN] Tüm oturum verileri RAM\'den temizlendi!</div>';
                this.statusElement.textContent = "İmha Edildi";
                this.statusElement.style.color = "var(--danger)";
                document.getElementById('systemPulse').style.backgroundColor = "var(--danger)";
                document.getElementById('systemPulse').style.boxShadow = "0 0 10px var(--danger)";
            }

            persistEphemeralState() {
                try {
                    sessionStorage.setItem('smart_kernel_dump', this.streamElement.innerHTML);
                } catch (e) {
                    console.error("Bellek sınırı.");
                }
            }

            restoreSession() {
                const cached = sessionStorage.getItem('smart_kernel_dump');
                if (cached) {
                    this.streamElement.innerHTML = cached;
                    this.streamElement.scrollTop = this.streamElement.scrollHeight;
                }
            }

            exportDump() {
                const dumpText = this.streamElement.innerText;
                const blob = new Blob([dumpText], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'smart-session-' + Date.now() + '.log';
                link.click();
                URL.revokeObjectURL(url);
            }

            bindEvents() {
                this.inputElement.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.dispatchMessage();
                    }
                });
            }
        }

        const SmartKernel = new SmartSecurityKernel();
    </script>
</body>
</html>
