<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güneş AI Ultra - Devasa Sürüm v5.0</title>
    
    <!-- Font Awesome & Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Highlight.js CSS (Dark Modern) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    
    <!-- Markdown & Syntax Highlighting JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        /* ==========================================
           DEĞİŞKENLER VE TEMEL AYARLAR (CSS CORE)
           ========================================== */
        :root {
            --bg-deep: #030712;
            --sidebar-bg: rgba(9, 13, 22, 0.85);
            --chat-bg: rgba(15, 23, 42, 0.75);
            --border-color: rgba(56, 189, 248, 0.2);
            --border-glow: rgba(56, 189, 248, 0.5);
            --accent-cyan: #38bdf8;
            --accent-blue: #2563eb;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-bubble: linear-gradient(135deg, #2563eb, #1d4ed8);
            --bot-bubble: rgba(30, 41, 59, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            scrollbar-width: thin;
            scrollbar-color: rgba(56, 189, 248, 0.3) transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        /* ==========================================
           EFSANE HAREKETLİ ARKA PLAN ANİMASYONU
           ========================================== */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #030712 100%);
        }

        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(56, 189, 248, 0.08);
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            animation: floatGlow 10s infinite alternate ease-in-out;
        }
        .glow-1 { top: -10%; left: -10%; }
        .glow-2 { bottom: -10%; right: -10%; background: rgba(139, 92, 246, 0.08); animation-delay: -5s; }

        @keyframes floatGlow {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        /* ==========================================
           ANA UYGULAMA DÜZENİ (LAYOUT)
           ========================================== */
        .app-wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
            padding: 16px;
            gap: 16px;
            backdrop-filter: blur(20px);
        }

        /* Sol Panel (Geçmiş & Kontroller) */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 0.5px;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 14px;
        }
        .brand-box i {
            color: var(--accent-cyan);
            font-size: 22px;
            filter: drop-shadow(0 0 10px var(--accent-cyan));
        }

        .new-chat-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: 0.2s;
        }
        .new-chat-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .history-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            background: rgba(255,255,255,0.03);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .history-item:hover, .history-item.active {
            background: rgba(56, 189, 248, 0.1);
            color: #fff;
            border-color: var(--border-color);
        }

        .sidebar-footer {
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        /* Sağ Alan (Sohbet Ekranı) */
        .chat-main {
            flex: 1;
            background: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 40px rgba(56, 189, 248, 0.1);
            backdrop-filter: blur(16px);
        }

        .chat-header {
            padding: 16px 24px;
            background: rgba(11, 15, 25, 0.6);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 15px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-select, .action-btn {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }
        .control-select:hover, .action-btn:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-cyan);
        }
        .action-btn { color: #f8fafc; }

        /* Sohbet Kutusu */
        #chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        .msg-row {
            display: flex;
            gap: 14px;
            max-width: 85%;
            animation: messageIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user-row { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot-row { align-self: flex-start; }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .user-row .msg-avatar { background: var(--accent-blue); color: #fff; }
        .bot-row .msg-avatar { background: #1e293b; color: var(--accent-cyan); border: 1px solid var(--border-color); }

        .msg-content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            user-select: text;
        }
        .user-row .msg-bubble {
            background: var(--user-bubble);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        .bot-row .msg-bubble {
            background: var(--bot-bubble);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        /* Kod Blokları & Markdown */
        .bot-row .msg-bubble pre {
            background: #090d16;
            padding: 14px;
            border-radius: 10px;
            margin-top: 10px;
            overflow-x: auto;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }
        .bot-row .msg-bubble code {
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            color: #38bdf8;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 6px 12px;
            font-size: 12px;
            color: #94a3b8;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin: -14px -14px 10px -14px;
        }
        .copy-code-btn {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }
        .copy-code-btn:hover {
            background: var(--accent-cyan);
            color: #020617;
        }

        /* Alt Yazma Alanı */
        .input-area {
            padding: 16px 24px;
            background: rgba(11, 15, 25, 0.6);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            transition: 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            padding: 14px 0;
            outline: none;
            user-select: text;
        }
        input[type="text"]::placeholder { color: var(--text-muted); }

        .send-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            color: #020617;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: 0.2s;
        }
        .send-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        /* Responsive */
        @media(max-width: 768px) {
            .sidebar { display: none; }
            .app-wrapper { padding: 8px; }
        }
    </style>
</head>
<body>

    <!-- Arka Plan Efektleri -->
    <canvas id="canvas-bg"></canvas>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="app-wrapper">
        <!-- Sol Panel -->
        <div class="sidebar">
            <div class="brand-box">
                <i class="fa-solid fa-bolt"></i> Güneş AI Ultra
            </div>
            <button class="new-chat-btn" onclick="createNewSession()">
                <i class="fa-solid fa-plus"></i> Yeni Sohbet
            </button>
            <div class="history-container" id="history-list">
                <!-- Geçmiş dinamik dolacak -->
            </div>
            <div class="sidebar-footer">
                Yusuf Can Güneş © 2026
            </div>
        </div>

        <!-- Sağ Ana Sohbet Paneli -->
        <div class="chat-main">
            <div class="chat-header">
                <div class="header-title">
                    <div class="status-dot"></div>
                    <span id="active-session-title">Sohbet Aktif</span>
                </div>
                <div class="header-actions">
                    <select id="ai-mode" class="control-select">
                        <option value="turbo">⚡ Turbo (Işık Hızı)</option>
                        <option value="coder">💻 Kod Mimarı</option>
                        <option value="security">🛡️ Siber Güvenlik</option>
                    </select>
                    <button class="action-btn" onclick="clearCurrentChat()" title="Temizle"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>

            <div id="chat-box">
                <div class="msg-row bot-row">
                    <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-content-wrapper">
                        <div class="msg-bubble">Harika bir arka plan ve dev altyapı ile karşınızdayım kanka! İstediğin soruyu sor, roket gibi akalım. 🚀</div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="Mesajını yaz..." onkeydown="if(event.key==='Enter') sendMessage()">
                </div>
                <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================
           KANVAS ARKA PLAN (PARÇACIK / YILDIZ AĞI)
           ========================================== */
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.radius = Math.random() * 1.5 + 0.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 70; i++) particles.push(new Particle());

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            
            // Parçacıkları çiz ve birbirine bağla
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(56, 189, 248, ${0.15 * (1 - dist / 120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();


        /* ==========================================
           SOHBET VE HAFIZA YÖNETİMİ
           ========================================== */
        let sessions = JSON.parse(localStorage.getItem('gunes_sessions_v5')) || [];
        let currentSessionId = null;

        window.onload = () => {
            if (sessions.length > 0) {
                loadSession(sessions[0].id);
            } else {
                createNewSession();
            }
        };

        function createNewSession() {
            currentSessionId = 's_' + Date.now();
            sessions.unshift({ id: currentSessionId, title: 'Yeni Sohbet', messages: [] });
            saveAndRender();
            document.getElementById('chat-box').innerHTML = `
                <div class="msg-row bot-row">
                    <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-content-wrapper">
                        <div class="msg-bubble">Yeni sohbet başladı kanka, dinliyorum! ⚡</div>
                    </div>
                </div>`;
            document.getElementById('active-session-title').innerText = 'Yeni Sohbet';
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const msg = input.value.trim();
            if (!msg) return;

            const chatBox = document.getElementById('chat-box');

            // Kullanıcı Mesajını Ekle
            appendMessage('user', msg);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            let session = sessions.find(s => s.id === currentSessionId);
            if (session) {
                if (session.title === 'Yeni Sohbet') {
                    session.title = msg.substring(0, 25) + '...';
                    document.getElementById('active-session-title').innerText = session.title;
                }
                session.messages.push({ role: 'user', content: msg });
            }

            // Yükleniyor Göstergesi
            const loadId = 'load-' + Date.now();
            const loadRow = document.createElement('div');
            loadRow.className = 'msg-row bot-row';
            loadRow.id = loadId;
            loadRow.innerHTML = `
                <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="msg-content-wrapper">
                    <div class="msg-bubble"><i class="fa-solid fa-spinner fa-spin"></i> Düşünüyor...</div>
                </div>`;
            chatBox.appendChild(loadRow);
            chatBox.scrollTop = chatBox.scrollHeight;

            const mode = document.getElementById('ai-mode').value;
            let prompt = `Yusuf Can Güneş'in asistanısın. Türkçe yanıt ver: ${msg}`;
            if (mode === 'coder') prompt = `Yusuf Can Güneş'in yazılım mimarısın. Temiz kodlar yaz: ${msg}`;
            if (mode === 'security') prompt = `Yusuf Can Güneş'in siber güvenlik uzmanısın. Yasal savunma odaklı yanıtla: ${msg}`;

            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                const reply = await res.text();

                document.getElementById(loadId).remove();
                appendMessage('bot', reply);

                if (session) {
                    session.messages.push({ role: 'bot', content: reply });
                    saveAndRender();
                }
            } catch (e) {
                document.getElementById(loadId).remove();
                appendMessage('bot', 'Bağlantı hatası oluştu kanka, tekrar dene.');
            } finally {
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function appendMessage(role, text) {
            const chatBox = document.getElementById('chat-box');
            const row = document.createElement('div');
            row.className = `msg-row ${role === 'user' ? 'user-row' : 'bot-row'}`;
            
            let htmlContent = role === 'user' ? escapeHtml(text) : marked.parse(text);

            row.innerHTML = `
                <div class="msg-avatar"><i class="fa-solid ${role === 'user' ? 'fa-user' : 'fa-robot'}"></i></div>
                <div class="msg-content-wrapper">
                    <div class="msg-bubble">${htmlContent}</div>
                </div>`;
            
            chatBox.appendChild(row);

            // Kod bloklarına kopyalama butonu ekle
            if (role === 'bot') {
                row.querySelectorAll('pre').forEach(pre => {
                    const code = pre.querySelector('code');
                    if (code) {
                        hljs.highlightElement(code);
                        const header = document.createElement('div');
                        header.className = 'code-header';
                        header.innerHTML = `<span>Kod Bloğu</span><button class="copy-code-btn" onclick="copyCode(this)">Kopyala</button>`;
                        pre.insertBefore(header, code);
                    }
                });
            }
        }

        function copyCode(btn) {
            const codeText = btn.parentElement.nextElementSibling.innerText;
            navigator.clipboard.writeText(codeText);
            btn.innerText = 'Kopyalandı!';
            setTimeout(() => btn.innerText = 'Kopyala', 2000);
        }

        function saveAndRender() {
            localStorage.setItem('gunes_sessions_v5', JSON.stringify(sessions));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            sessions.forEach(s => {
                const item = document.createElement('div');
                item.className = `history-item ${s.id === currentSessionId ? 'active' : ''}`;
                item.innerText = s.title;
                item.onclick = () => loadSession(s.id);
                list.appendChild(item);
            });
        }

        function loadSession(id) {
            currentSessionId = id;
            const session = sessions.find(s => s.id === id);
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';

            if (session && session.messages.length > 0) {
                document.getElementById('active-session-title').innerText = session.title;
                session.messages.forEach(m => appendMessage(m.role, m.content));
            } else {
                chatBox.innerHTML = `
                    <div class="msg-row bot-row">
                        <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                        <div class="msg-content-wrapper">
                            <div class="msg-bubble">Sohbet boş, yazmaya başlayabilirsin!</div>
                        </div>
                    </div>`;
            }
            renderHistory();
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function clearCurrentChat() {
            let session = sessions.find(s => s.id === currentSessionId);
            if (session) {
                session.messages = [];
                saveAndRender();
                loadSession(currentSessionId);
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
