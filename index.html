<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güneş AI - Akıllı Asistan</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030712;
            --card-bg: rgba(17, 24, 39, 0.75);
            --card-border: rgba(56, 189, 248, 0.2);
            --user-bubble: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --bot-bubble: rgba(31, 41, 55, 0.8);
            --accent-cyan: #38bdf8;
            --accent-purple: #8b5cf6;
            --glow-color: rgba(56, 189, 248, 0.25);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center;
            align-items: center;
            height: 100vh; 
            padding: 15px; 
            overflow: hidden;
            position: relative;
        }

        /* Arka Plan Hareketli Neon Küreler ve Izgara */
        .bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
            opacity: 0.6;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            z-index: 0;
            opacity: 0.45;
            animation: pulseGlow 12s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 450px;
            height: 450px;
            background: #38bdf8;
            top: -10%;
            left: -10%;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: #7c3aed;
            bottom: -15%;
            right: -10%;
            animation-delay: -6s;
        }

        @keyframes pulseGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.15); }
        }

        /* Ana Gövde Cam Efekti */
        .chat-container {
            position: relative;
            z-index: 10;
            max-width: 950px;
            width: 100%;
            height: 92vh;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px var(--glow-color);
            overflow: hidden;
        }

        /* Üst Header */
        .chat-header {
            padding: 20px 28px;
            background: rgba(11, 15, 25, 0.85);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bot-brand { display: flex; align-items: center; gap: 14px; }

        .avatar-glow {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            box-shadow: 0 0 18px var(--glow-color);
        }

        .bot-brand h2 { font-size: 19px; font-weight: 700; color: #fff; letter-spacing: 0.3px; }
        .status-badge { font-size: 12px; color: #34d399; display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .status-dot { width: 8px; height: 8px; background-color: #34d399; border-radius: 50%; box-shadow: 0 0 10px #34d399; }

        .header-btns { display: flex; gap: 10px; }
        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .icon-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-cyan); color: #fff; }

        /* Mesaj Alanı */
        #chat-box { 
            flex: 1; 
            padding: 28px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            scroll-behavior: smooth;
        }

        .msg-row {
            display: flex;
            gap: 14px;
            max-width: 82%;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user-row { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot-row { align-self: flex-start; }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .user-row .msg-avatar { background: var(--user-bubble); color: white; }
        .bot-row .msg-avatar { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid var(--card-border); }

        .msg-content { 
            padding: 16px 20px; 
            border-radius: 20px; 
            line-height: 1.65; 
            font-size: 15px;
            word-wrap: break-word; 
        }

        .user-row .msg-content { 
            background: var(--user-bubble); 
            color: #ffffff; 
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .bot-row .msg-content { 
            background-color: var(--bot-bubble); 
            color: var(--text-main); 
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            white-space: pre-wrap;
        }

        /* Hızlı Sorular */
        .chips-bar {
            display: flex;
            gap: 10px;
            padding: 0 28px 12px 28px;
            overflow-x: auto;
        }

        .chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .chip:hover { 
            border-color: var(--accent-cyan); 
            color: var(--accent-cyan); 
            background: rgba(56, 189, 248, 0.1);
            transform: translateY(-2px);
        }

        /* Alt Mesaj Alanı */
        #input-area { 
            display: flex; 
            gap: 12px; 
            padding: 20px 28px; 
            background: rgba(11, 15, 25, 0.9);
            border-top: 1px solid var(--card-border);
        }

        input[type="text"] { 
            flex: 1; 
            padding: 16px 20px; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            background-color: rgba(31, 41, 55, 0.6); 
            color: #fff; 
            font-size: 15px; 
            font-family: inherit;
            outline: none; 
            transition: all 0.3s ease;
        }

        input[type="text"]:focus { 
            border-color: var(--accent-cyan); 
            box-shadow: 0 0 15px var(--glow-color);
            background-color: rgba(31, 41, 59, 0.9);
        }

        button.send-btn { 
            padding: 0 26px; 
            border-radius: 16px; 
            border: none; 
            background: linear-gradient(135deg, var(--accent-cyan), #2563eb); 
            color: #fff; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 16px; 
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--glow-color);
        }

        button.send-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px var(--glow-color);
        }

        /* Modal (Ayarlar Penceresi) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: #111827;
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .modal-card h3 { margin-bottom: 12px; color: #fff; display: flex; align-items: center; gap: 8px; }
        .modal-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        .modal-card input { width: 100%; margin-bottom: 20px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="bot-brand">
                <div class="avatar-glow"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                <div>
                    <h2>Güneş AI</h2>
                    <span class="status-badge"><span class="status-dot"></span> Çevrim içi</span>
                </div>
            </div>
            <div class="header-btns">
                <button class="icon-btn" onclick="openSettings()" title="API Anahtarı Ayarları"><i class="fa-solid fa-gear"></i> Ayarlar</button>
                <button class="icon-btn" onclick="clearChat()" title="Sohbeti Temizle"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </div>

        <!-- Chat Kutusu -->
        <div id="chat-box">
            <div class="msg-row bot-row">
                <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="msg-content">Merhaba! Ben Güneş AI. Sana bugün nasıl yardımcı olabilirim? 🚀</div>
            </div>
        </div>

        <!-- Hızlı Sorular -->
        <div class="chips-bar">
            <div class="chip" onclick="sendQuick('Bana ilginç ve az bilinen bir bilgi ver!')">💡 İlginç Bilgi</div>
            <div class="chip" onclick="sendQuick('Komik ve eğlenceli bir espri yap')">😂 Espri Yap</div>
            <div class="chip" onclick="sendQuick('Bana günün motivaasyon sözünü söyle')">✨ Motivasyon</div>
        </div>

        <!-- Mesaj Giriş Alanı -->
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Bir şeyler yazın..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Ayarlar Modalı -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-card">
            <h3><i class="fa-solid fa-key" style="color: var(--accent-cyan);"></i> API Anahtarı Ayarı</h3>
            <p>Google AI Studio'dan aldığın API anahtarını buraya yapıştırıp kaydedebilirsin. Sitede saklanır ve sorunsuz çalışır.</p>
            <input type="text" id="api-key-input" placeholder="AIzaSy...">
            <div class="modal-actions">
                <button class="icon-btn" onclick="closeSettings()">İptal</button>
                <button class="send-btn" style="padding: 10px 20px;" onclick="saveApiKey()">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        // Koda API yazmak istersen buraya koyabilirsin (İsteğe bağlı):
        const DEFAULT_KEY = "BURAYA_KEY_YAZABILIRSIN";

        function getApiKey() {
            return localStorage.getItem('GUNES_AI_KEY') || DEFAULT_KEY;
        }

        let chatHistory = [];

        function openSettings() {
            document.getElementById('api-key-input').value = localStorage.getItem('GUNES_AI_KEY') || '';
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (key) {
                localStorage.setItem('GUNES_AI_KEY', key);
                alert("API Anahtarı başarıyla kaydedildi! Artık sohbet edebilirsin.");
            } else {
                localStorage.removeItem('GUNES_AI_KEY');
            }
            closeSettings();
        }

        function sendQuick(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        function clearChat() {
            chatHistory = [];
            document.getElementById('chat-box').innerHTML = `
                <div class="msg-row bot-row">
                    <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-content">Sohbet temizlendi. Yeni bir soru sorabilirsin! ✨</div>
                </div>`;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            const apiKey = getApiKey();
            const chatBox = document.getElementById('chat-box');

            // Kullanıcı mesajı
            chatBox.innerHTML += `
                <div class="msg-row user-row">
                    <div class="msg-avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="msg-content">${escapeHtml(message)}</div>
                </div>`;
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Key Kontrolü
            if (!apiKey || apiKey.includes("BURAYA_KEY") || apiKey.length < 15) {
                chatBox.innerHTML += `
                    <div class="msg-row bot-row">
                        <div class="msg-avatar"><i class="fa-solid fa-triangle-exclamation"></i></div>
                        <div class="msg-content">⚠️ <b>API Anahtarı Bulunamadı!</b><br>Lütfen sağ üstteki <b>⚙️ Ayarlar</b> butonuna tıklayarak Google API anahtarını ekleyin.</div>
                    </div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                openSettings();
                return;
            }

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div class="msg-row bot-row" id="${loadingId}">
                    <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-content"><i>Düşünüyor...</i></div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            chatHistory.push({ role: "user", parts: [{ text: message }] });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: "Sen her konuda uzman, samimi, eğlenceli ve yardımsever bir yapay zeka asistanısın. İsmin Güneş AI." }]
                        },
                        contents: chatHistory
                    })
                });

                const data = await response.json();
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const botReply = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `
                        <div class="msg-row bot-row">
                            <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                            <div class="msg-content">${formatReply(botReply)}</div>
                        </div>`;
                    chatHistory.push({ role: "model", parts: [{ text: botReply }] });
                } else {
                    chatBox.innerHTML += `
                        <div class="msg-row bot-row">
                            <div class="msg-avatar"><i class="fa-solid fa-circle-exclamation"></i></div>
                            <div class="msg-content">Yanıt alınamadı. API anahtarınız geçersiz veya kotası dolmuş olabilir.</div>
                        </div>`;
                }

            } catch (err) {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();
                
                chatBox.innerHTML += `
                    <div class="msg-row bot-row">
                        <div class="msg-avatar"><i class="fa-solid fa-circle-xmark"></i></div>
                        <div class="msg-content">Bağlantı hatası oluştu! İnternetinizi veya API anahtarınızı kontrol edin.</div>
                    </div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatReply(text) {
            return text.replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
