<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güneş AI Ultra - Akıllı Asistan</title>
    
    <!-- Dış Kütüphaneler -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-dark: #030712;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(56, 189, 248, 0.25);
            --user-bubble: linear-gradient(135deg, #2563eb, #1d4ed8);
            --bot-bubble: rgba(30, 41, 59, 0.85);
            --accent-cyan: #38bdf8;
            --accent-purple: #8b5cf6;
            --glow-color: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        /* Arka Plan Efektleri */
        .bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 0;
            opacity: 0.6;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            z-index: 0;
            opacity: 0.4;
            animation: pulseGlow 10s infinite alternate ease-in-out;
        }

        .blob-1 { width: 500px; height: 500px; background: #38bdf8; top: -10%; left: -10%; }
        .blob-2 { width: 550px; height: 550px; background: #7c3aed; bottom: -15%; right: -10%; animation-delay: -5s; }

        @keyframes pulseGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        /* Ana Container */
        .chat-container {
            position: relative;
            z-index: 10;
            max-width: 1100px;
            width: 100%;
            height: 96vh;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 35px var(--glow-color);
            overflow: hidden;
        }

        /* Başlık Alanı */
        .chat-header {
            padding: 16px 24px;
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bot-brand { display: flex; align-items: center; gap: 14px; }

        .avatar-glow {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            box-shadow: 0 0 20px var(--glow-color);
        }

        .bot-brand h2 { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
        .status-badge { font-size: 13px; color: #34d399; display: flex; align-items: center; gap: 6px; font-weight: 600; margin-top: 2px; }
        .status-dot { width: 8px; height: 8px; background-color: #34d399; border-radius: 50%; box-shadow: 0 0 10px #34d399; }

        .header-btns { display: flex; gap: 8px; align-items: center; }
        
        .icon-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 9px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .icon-btn:hover { background: rgba(56, 189, 248, 0.2); border-color: var(--accent-cyan); }

        /* Sohbet Alanı */
        #chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .msg-row {
            display: flex;
            gap: 14px;
            max-width: 90%;
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user-row { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot-row { align-self: flex-start; }

        .msg-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .user-row .msg-avatar { background: var(--user-bubble); color: white; }
        .bot-row .msg-avatar { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid var(--card-border); }

        .msg-content {
            padding: 16px 20px;
            border-radius: 20px;
            line-height: 1.7;
            font-size: 15px;
            word-wrap: break-word;
            overflow-x: auto;
            user-select: text;
        }

        .user-row .msg-content {
            background: var(--user-bubble);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .bot-row .msg-content {
            background-color: var(--bot-bubble);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .msg-content p { margin-bottom: 10px; }
        .msg-content p:last-child { margin-bottom: 0; }
        .msg-content h1, .msg-content h2, .msg-content h3 { margin: 14px 0 8px 0; color: var(--accent-cyan); }
        .msg-content ul, .msg-content ol { margin-left: 20px; margin-bottom: 10px; }
        .msg-content li { margin-bottom: 4px; }
        .msg-content code { font-family: 'Fira Code', monospace; background: rgba(0,0,0,0.4); padding: 3px 7px; border-radius: 6px; font-size: 13px; color: #f472b6; }
        
        .code-wrapper {
            position: relative;
            margin: 14px 0;
            border-radius: 12px;
            overflow: hidden;
            background: #1e1e2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .code-wrapper pre { margin: 0; padding: 16px; overflow-x: auto; font-family: 'Fira Code', monospace; }
        .code-wrapper code { background: transparent; padding: 0; color: inherit; }
        
        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .copy-code-btn:hover { background: var(--accent-cyan); color: #000; }

        .chips-bar {
            display: flex;
            gap: 10px;
            padding: 0 24px 14px 24px;
            overflow-x: auto;
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
            font-weight: 500;
        }

        .chip:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.12);
            transform: translateY(-2px);
        }

        #input-area {
            display: flex;
            gap: 12px;
            padding: 18px 24px;
            background: rgba(11, 15, 25, 0.95);
            border-top: 1px solid var(--card-border);
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background-color: rgba(30, 41, 59, 0.7);
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
            user-select: text;
        }

        input[type="text"]:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px var(--glow-color);
            background-color: rgba(30, 41, 59, 0.9);
        }

        .action-btn {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(30, 41, 59, 0.7);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .action-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        button.send-btn {
            padding: 0 28px;
            height: 50px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--accent-cyan), #2563eb);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        button.send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="chat-container">
        <!-- Panel Üst Bar -->
        <div class="chat-header">
            <div class="bot-brand">
                <div class="avatar-glow"><i class="fa-solid fa-bolt"></i></div>
                <div>
                    <h2>Güneş AI Ultra</h2>
                    <span class="status-badge"><span class="status-dot"></span> Doğal Ses & Akıllı Yapay Zeka</span>
                </div>
            </div>
            <div class="header-btns">
                <button class="icon-btn" onclick="toggleSpeech()" id="speech-toggle-btn"><i class="fa-solid fa-volume-high"></i> Ses: Açık</button>
                <button class="icon-btn" onclick="exportChat()"><i class="fa-solid fa-download"></i> İndir</button>
                <button class="icon-btn" onclick="clearChat()"><i class="fa-solid fa-rotate-right"></i> Temizle</button>
            </div>
        </div>

        <!-- Sohbet Akışı -->
        <div id="chat-box">
            <div class="msg-row bot-row">
                <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="msg-content">Naber kanka! Ben <b>Güneş AI Ultra</b>. Yenilenmiş doğal insan sesi ve ultra zekamla hazır durumdayım. Ne yapıyoruz bugün? 🚀</div>
            </div>
        </div>

        <!-- Öneri Butonları -->
        <div class="chips-bar">
            <div class="chip" onclick="sendQuick('Bana Python ile harika bir HTML oyun kopyası oluştur')">🎮 Oyun Kodu Yaz</div>
            <div class="chip" onclick="sendQuick('Minecraft Redstone ve Komut Blokları ile neler yapılabilir?')">⛏️ Minecraft Taktikleri</div>
            <div class="chip" onclick="sendQuick('Aklımı başımdan alacak zekice ve eğlenceli bir hikaye anlat')">💡 Zeki Hikaye</div>
            <div class="chip" onclick="sendQuick('Güneş AI olarak bana komik bir espri yap')">😂 Espri Yap</div>
        </div>

        <!-- Alt Input Bar -->
        <div id="input-area">
            <button class="action-btn" onclick="startVoiceInput()" title="Sesle Yaz"><i class="fa-solid fa-microphone" id="mic-icon"></i></button>
            <input type="text" id="user-input" placeholder="Güneş AI'ya dilediğin soruyu sor..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i> Gönder</button>
        </div>
    </div>

    <script>
        let chatHistory = [];
        let speechEnabled = true;
        let selectedNaturalVoice = null;

        // Markdown İşleyici
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            }
        });

        // 1. GELİŞMİŞ İNSAN SESİ MOTORU (Robotik ve Çeviri Havasını Kaldırır)
        function initNaturalVoice() {
            if (!('speechSynthesis' in window)) return;
            
            const voices = window.speechSynthesis.getVoices();
            const trVoices = voices.filter(v => v.lang.startsWith('tr') || v.lang.includes('TR'));

            // Doğallık Sıralaması: Microsoft Natural / Google Neural -> Standart Türkçe
            selectedNaturalVoice = trVoices.find(v => v.name.includes('Natural') || v.name.includes('Online')) ||
                                   trVoices.find(v => v.name.includes('Google')) ||
                                   trVoices.find(v => v.name.includes('Yelda') || v.name.includes('Tolga')) ||
                                   trVoices[0] || null;
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = initNaturalVoice;
            initNaturalVoice();
        }

        function speakText(text) {
            if (!speechEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            // Okumadan önce kod bloklarını ve markdown işaretlerini seslendirmenin bozmaması için temizle
            let cleanText = text
                .replace(/```[\s\S]*?```/g, 'İlgili kod bloğu ektedir.') 
                .replace(/`([^`]+)`/g, '$1')
                .replace(/[*#_~]/g, '')
                .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                .trim();

            if (!cleanText) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'tr-TR';

            if (selectedNaturalVoice) {
                utterance.voice = selectedNaturalVoice;
            }

            // Gerçek insan konuşma akıcılığı
            utterance.rate = 1.0; 
            utterance.pitch = 1.02;

            window.speechSynthesis.speak(utterance);
        }

        // Sayfa Açıldığında Geçmişi Yükle
        window.onload = () => {
            initNaturalVoice();
            const savedHistory = localStorage.getItem('gunes_ai_history');
            if (savedHistory) {
                try {
                    chatHistory = JSON.parse(savedHistory);
                    renderSavedChat();
                } catch (e) {
                    chatHistory = [];
                }
            }
        };

        function sendQuick(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        function toggleSpeech() {
            speechEnabled = !speechEnabled;
            const btn = document.getElementById('speech-toggle-btn');
            if (speechEnabled) {
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Ses: Açık';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i> Ses: Kapalı';
                window.speechSynthesis.cancel();
            }
        }

        function startVoiceInput() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Tarayıcınız sesle yazdırmayı desteklemiyor.');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';

            const micIcon = document.getElementById('mic-icon');
            micIcon.className = 'fa-solid fa-spinner fa-spin';

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('user-input').value = text;
                micIcon.className = 'fa-solid fa-microphone';
            };

            recognition.onerror = () => micIcon.className = 'fa-solid fa-microphone';
            recognition.onend = () => micIcon.className = 'fa-solid fa-microphone';

            recognition.start();
        }

        function clearChat() {
            chatHistory = [];
            localStorage.removeItem('gunes_ai_history');
            window.speechSynthesis.cancel();
            document.getElementById('chat-box').innerHTML = `
                <div class="msg-row bot-row">
                    <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-content">Sohbet sıfırlandı! Yeni sorunu sorabilirsin kanka. ✨</div>
                </div>`;
        }

        function exportChat() {
            if (chatHistory.length === 0) {
                alert("Henüz indirilecek bir sohbet yok!");
                return;
            }
            let textContent = "--- Güneş AI Ultra Sohbet Geçmişi ---\n\n";
            chatHistory.forEach(msg => {
                textContent += `[${msg.role === 'user' ? 'Kullanıcı' : 'Güneş AI'}]:\n${msg.content}\n\n`;
            });

            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Gunes_AI_Sohbet_${Date.now()}.txt`;
            a.click();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-box');

            // Kullanıcı Mesajını Ekle
            chatBox.innerHTML += `
                <div class="msg-row user-row">
                    <div class="msg-avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="msg-content">${escapeHtml(message)}</div>
                </div>`;

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            chatHistory.push({ role: "user", content: message });
            saveChatHistory();

            // Yükleniyor Durumu
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div class="msg-row bot-row" id="${loadingId}">
                    <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-content"><i><i class="fa-solid fa-spinner fa-spin"></i> Zekam çalışıyor, düşünüyor...</i></div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Kesintisiz & Ücretsiz Yapay Zeka Servisi
                const response = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            {
                                role: "system",
                                content: "Sen Güneş AI Ultra adında son derece akıllı, espri anlayışı yüksek, uzman bir yapay zeka asistanısın. Türkçe konuşursun. Kod sorularına eksiksiz kodlar verirsin."
                            },
                            ...chatHistory
                        ],
                        model: "openai"
                    })
                });

                if (!response.ok) throw new Error("Yanıt alınamadı.");

                const botReply = await response.text();

                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                // Bot Cevabını Yapıştır
                chatBox.innerHTML += `
                    <div class="msg-row bot-row">
                        <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                        <div class="msg-content">${renderMarkdown(botReply)}</div>
                    </div>`;

                chatHistory.push({ role: "assistant", content: botReply });
                saveChatHistory();

                applyCodeBlocks();
                speakText(botReply);

            } catch (err) {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                chatBox.innerHTML += `
                    <div class="msg-row bot-row">
                        <div class="msg-avatar"><i class="fa-solid fa-circle-exclamation"></i></div>
                        <div class="msg-content">Bağlantıda aksaklık oldu. Lütfen tekrar dene kanka!</div>
                    </div>`;
            } finally {
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function renderMarkdown(text) {
            return marked.parse(text);
        }

        function applyCodeBlocks() {
            document.querySelectorAll('pre code').forEach((block) => {
                if (!block.parentElement.classList.contains('code-wrapper')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'code-wrapper';

                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-code-btn';
                    copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Kopyala';
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(block.innerText);
                        copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Kopyalandı!';
                        setTimeout(() => copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Kopyala', 2000);
                    };

                    block.parentElement.parentNode.insertBefore(wrapper, block.parentElement);
                    wrapper.appendChild(copyBtn);
                    wrapper.appendChild(block.parentElement);
                    hljs.highlightElement(block);
                }
            });
        }

        function saveChatHistory() {
            if (chatHistory.length > 30) chatHistory = chatHistory.slice(chatHistory.length - 30);
            localStorage.setItem('gunes_ai_history', JSON.stringify(chatHistory));
        }

        function renderSavedChat() {
            const chatBox = document.getElementById('chat-box');
            chatHistory.forEach(msg => {
                if (msg.role === 'user') {
                    chatBox.innerHTML += `
                        <div class="msg-row user-row">
                            <div class="msg-avatar"><i class="fa-solid fa-user"></i></div>
                            <div class="msg-content">${escapeHtml(msg.content)}</div>
                        </div>`;
                } else {
                    chatBox.innerHTML += `
                        <div class="msg-row bot-row">
                            <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                            <div class="msg-content">${renderMarkdown(msg.content)}</div>
                        </div>`;
                }
            });
            applyCodeBlocks();
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
