<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kanka Sohbet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: #1f1f1f;
            padding: 16px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 1px solid #2c2c2c;
            color: #ffffff;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 1rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .user-msg {
            background-color: #007aff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background-color: #262626;
            color: #f1f1f1;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            background-color: #1f1f1f;
            padding: 12px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #2c2c2c;
        }

        input {
            flex: 1;
            background-color: #2c2c2c;
            border: none;
            border-radius: 24px;
            padding: 12px 18px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        button {
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 24px;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        button:active {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <header>N Kaynıyon Kanka? 💬</header>

    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">Oov, sonunda geldin! Anlat bakalım, bugün hangi projeyi patlatıyoruz ya da ne hakkında kaynatalım?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Bir şeyler yaz..." autocomplete="off">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Kullanıcının mesajını ekle
            appendMessage(text, 'user-msg');
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Doğal ve samimi yanıt üretme mekanizması
            setTimeout(() => {
                const reply = getFriendlyResponse(text);
                appendMessage(reply, 'ai-msg');
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        }

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.textContent = text;
            chatBox.appendChild(div);
        }

        function getFriendlyResponse(input) {
            const lower = input.toLowerCase();

            if (lower.includes('selam') || lower.includes('merhaba') || lower.includes('hey')) {
                return "Aleykümselam kanka, nasılsın, ne var ne yok?";
            } else if (lower.includes('nasılsın') || lower.includes('ne yapıyon') || lower.includes('nays')) {
                return "İyiyim valla, sen ne ediyon? Oyun moyun takılıyor musun yoksa başka bir plan mı var?";
            } else if (lower.includes('oyun') || lower.includes('minecraft') || lower.includes('pubg')) {
                return "Ooo, en sevdiğim konular! Eğlenceli bir şeyler mi arıyorsun yoksa sunucu falan mı kuracağız yine?";
            } else if (lower.includes('biliyon') || lower.includes('ne haber')) {
                return "Aynı, takılıyoruz işte burada seninle. Sen anlat bakalım, günün nasıl geçti?";
            } else {
                const responses = [
                    "Anladım kanka, bayağı mantıklı aslında. Başka neler düşünüyorsun?",
                    "Vay be, iyi dedin ha! Ona göre bir plan yapalım mı?",
                    "Hmm, bu konuyu biraz daha açsana, tam olarak ne yapmak istiyorsun?",
                    "Olay bu diyorsun yani! Kesinlikle katılıyorum sana."
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            }
        }

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
