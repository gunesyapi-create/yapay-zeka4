<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güneş AI - Kişisel Yapay Zeka Asistanı</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --user-msg: #2563eb;
            --bot-msg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center;
            align-items: center;
            height: 100vh; 
            padding: 15px; 
        }

        .chat-wrapper {
            max-width: 850px;
            width: 100%;
            height: 92vh;
            background-color: var(--card-bg);
            border: 1px solid #1e293b;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Üst Başlık & Profil */
        .chat-header {
            padding: 18px 24px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bot-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .bot-details h2 { font-size: 18px; font-weight: 600; color: #fff; }
        .status { font-size: 12px; color: #10b981; display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; display: inline-block; }

        .header-actions button {
            background: transparent;
            border: 1px solid #334155;
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .header-actions button:hover { background: #334155; color: #fff; }

        /* Chat Kutusu */
        #chat-box { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            scroll-behavior: smooth;
        }

        .msg-row {
            display: flex;
            gap: 12px;
            max-width: 82%;
        }

        .msg-row.user-row { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot-row { align-self: flex-start; }

        .msg-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user-row .msg-icon { background: var(--user-msg); color: white; }
        .bot-row .msg-icon { background: #334155; color: var(--accent); }

        .msg-bubble { 
            padding: 14px 18px; 
            border-radius: 16px; 
            line-height: 1.6; 
            font-size: 15px;
            word-wrap: break-word; 
        }

        .user-row .msg-bubble { 
            background-color: var(--user-msg); 
            color: #ffffff; 
            border-bottom-right-radius: 4px;
        }

        .bot-row .msg-bubble { 
            background-color: var(--bot-msg); 
            color: var(--text-main); 
            border-bottom-left-radius: 4px;
            border: 1px solid #334155;
            white-space: pre-wrap;
        }

        /* Hızlı Öneri Butonları */
        .chips-container {
            display: flex;
            gap: 8px;
            padding: 0 20px 10px 20px;
            overflow-x: auto;
        }

        .chip {
            background: #1e293b;
            border: 1px solid #334155;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .chip:hover { border-color: var(--accent); color: var(--accent); }

        /* Mesaj Giriş Alanı */
        #input-container { 
            display: flex; 
            gap: 10px; 
            padding: 16px 20px; 
            background: #0f172a;
            border-top: 1px solid #1e293b;
        }

        input { 
            flex: 1; 
            padding: 14px 18px; 
            border-radius: 12px; 
            border: 1px solid #334155; 
            background-color: #1e293b; 
            color: #fff; 
            font-size: 15px; 
            outline: none; 
            transition: 0.2s;
        }

        input:focus { border-color: var(--accent); }

        button.send-btn { 
            padding: 0 22px; 
            border-radius: 12px; 
            border: none; 
            background: linear-gradient(135deg, #38bdf8, #2563eb); 
            color: #fff; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 16px; 
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        button.send-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Özel Kaydırma Çubuğu */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="chat-wrapper">
        <!-- Üst Header -->
        <div class="chat-header">
            <div class="bot-info">
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="bot-details">
                    <h2>Güneş AI Bot</h2>
                    <span class="status"><span class="status-dot"></span> Çevrim içi (Gemini 1.5 Flash)</span>
                </div>
            </div>
            <div class="header-actions">
                <button onclick="clearChat()" title="Sohbeti Temizle"><i class="fa-solid fa-trash-can"></i> Temizle</button>
            </div>
        </div>

        <!-- Chat Mesaj Alanı -->
        <div id="chat-box">
            <div class="msg-row bot-row">
                <div class="msg-icon"><i class="fa-solid fa-robot"></i></div>
                <div class="msg-bubble">Merhaba! Ben Güneş AI. Sana bugün nasıl yardımcı olabilirim? 👋</div>
            </div>
        </div>

        <!-- Hızlı Soru Çipleri -->
        <div class="chips-container">
            <div class="chip" onclick="sendQuickMsg('Bana ilginç bir bilgi ver!')">💡 İlginç bir bilgi</div>
            <div class="chip" onclick="sendQuickMsg('Bana eğlenceli bir fıkra anlat')">😂 Fıkra anlat</div>
            <div class="chip" onclick="sendQuickMsg('Kod yazmama yardım edebilir misin?')">💻 Kod yardımı</div>
        </div>

        <!-- Alt Giriş Paneli -->
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Mesajınızı yazın..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // GitHub güvenlik kontrolüne takılmaması için API anahtarını 2 parçaya böldük:
        // Kendi API anahtarını ikiye bölüp tırnakların içine yapıştırabilirsin.
        const part1 = "AQ.Ab8RN6LbpVJB37p-lPJ_sBvI";
        const part2 = "aZ7CU3LvgyBpEfYrN0lml0Hv1g";
        
        const API_KEY = part1 + part2;
        
        let chatHistory = [];

        function sendQuickMsg(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        function clearChat() {
            chatHistory = [];
            document.getElementById('chat-box').innerHTML = `
                <div class="msg-row bot-row">
                    <div class="msg-icon"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-bubble">Sohbet geçmişi temizlendi. Yeni bir soru sorabilirsin! 😊</div>
                </div>`;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-box');

            // Kullanıcı Mesajını Ekle
            chatBox.innerHTML += `
                <div class="msg-row user-row">
                    <div class="msg-icon"><i class="fa-solid fa-user"></i></div>
                    <div class="msg-bubble">${escapeHtml(message)}</div>
                </div>`;
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            if (!API_KEY || API_KEY.length < 10) {
                chatBox.innerHTML += `
                    <div class="msg-row bot-row">
                        <div class="msg-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                        <div class="msg-bubble">⚠️ Geçerli bir API anahtarı bulunamadı. Lütfen koddaki part1 ve part2 alanlarını kontrol edin.</div>
                    </div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                return;
            }

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div class="msg-row bot-row" id="${loadingId}">
                    <div class="msg-icon"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-bubble"><i>Düşünüyor...</i></div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            chatHistory.push({ role: "user", parts: [{ text: message }] });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: "Sen her konuda son derece bilgili, yardımsever, samimi ve Türkçe konuşan havalı bir yapay zekasın." }]
                        },
                        contents: chatHistory
                    })
                });

                const data = await response.json();
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const botReply = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `
                        <div class="msg-row bot-row">
                            <div class="msg-icon"><i class="fa-solid fa-robot"></i></div>
                            <div class="msg-bubble">${formatReply(botReply)}</div>
                        </div>`;
                    chatHistory.push({ role: "model", parts: [{ text: botReply }] });
                } else {
                    chatBox.innerHTML += `
                        <div class="msg-row bot-row">
                            <div class="msg-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                            <div class="msg-bubble">Bir yanıt alınamadı. API anahtarınızın kotasını veya doğruluğunu kontrol edin.</div>
                        </div>`;
                }

            } catch (err) {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();
                
                chatBox.innerHTML += `
                    <div class="msg-row bot-row">
                        <div class="msg-icon"><i class="fa-solid fa-circle-xmark"></i></div>
                        <div class="msg-bubble">Bağlantı hatası oluştu! İnternet bağlantınızı kontrol edin.</div>
                    </div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatReply(text) {
            return text.replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
