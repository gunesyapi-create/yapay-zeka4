<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güneş AI Ultra - Kararlı Sürüm</title>
    
    <!-- Dış Kütüphaneler -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-dark: #020617;
            --card-bg: rgba(15, 23, 42, 0.95);
            --card-border: rgba(56, 189, 248, 0.35);
            --user-bubble: linear-gradient(135deg, #2563eb, #1d4ed8);
            --bot-bubble: rgba(30, 41, 59, 0.95);
            --accent-cyan: #38bdf8;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --glow-color: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        .bg-grid {
            position: absolute;
            width: 100%; height: 100%;
            background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px);
            background-size: 28px 28px;
            z-index: 0;
        }

        .chat-container {
            position: relative;
            z-index: 10;
            max-width: 1100px;
            width: 100%;
            height: 95vh;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 30px var(--glow-color);
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 20px;
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bot-brand { display: flex; align-items: center; gap: 12px; }
        .avatar-glow {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: #fff; box-shadow: 0 0 15px var(--glow-color);
        }
        .bot-brand h2 { font-size: 18px; font-weight: 800; color: #fff; }
        .status-badge { font-size: 12px; color: var(--accent-green); display: flex; align-items: center; gap: 6px; font-weight: 600; }
        .status-dot { width: 7px; height: 7px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); }

        .header-btns { display: flex; gap: 8px; align-items: center; }
        .mode-select {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }
        .mode-select option { background: #0f172a; color: #fff; }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            display: flex; align-items: center; gap: 6px;
            transition: 0.2s;
        }
        .icon-btn:hover { background: rgba(56, 189, 248, 0.2); border-color: var(--accent-cyan); }

        #chat-box {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 16px;
            scroll-behavior: smooth;
        }

        .msg-row { display: flex; gap: 12px; max-width: 85%; animation: fadeIn 0.15s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .msg-row.user-row { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot-row { align-self: flex-start; }

        .msg-avatar {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
        }
        .user-row .msg-avatar { background: var(--user-bubble); color: white; }
        .bot-row .msg-avatar { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid var(--card-border); }

        .msg-content {
            padding: 14px 16px; border-radius: 16px; line-height: 1.6; font-size: 14px; word-wrap: break-word; user-select: text;
        }
        .user-row .msg-content { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
        .bot-row .msg-content { background: var(--bot-bubble); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.08); }

        .code-wrapper {
            position: relative; margin: 10px 0; border-radius: 8px; overflow: hidden; background: #111827; border: 1px solid rgba(255,255,255,0.1);
        }
        .code-wrapper pre { margin: 0; padding: 12px; overflow-x: auto; font-family: 'Fira Code', monospace; }
        .copy-code-btn {
            position: absolute; top: 6px; right: 6px; background: rgba(255,255,255,0.1); border: none; color: #fff;
            padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;
        }
        .copy-code-btn:hover { background: var(--accent-cyan); color: #000; }

        #input-area {
            display: flex; gap: 10px; padding: 14px 20px;
            background: rgba(11, 15, 25, 0.95); border-top: 1px solid var(--card-border); align-items: center;
        }

        input[type="text"] {
            flex: 1; padding: 14px 18px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(30,41,59,0.7);
            color: #fff; font-size: 14px; font-family: inherit; outline: none; user-select: text;
        }
        input[type="text"]:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px var(--glow-color); }

        button.send-btn {
            padding: 0 22px; height: 48px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, var(--accent-cyan), #2563eb); color: #fff;
            font-weight: 700; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px;
        }
        button.send-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="bot-brand">
                <div class="avatar-glow"><i class="fa-solid fa-shield-halved"></i></div>
                <div>
                    <h2>Güneş AI Ultra</h2>
                    <span class="status-badge"><span class="status-dot"></span> Çevrimiçi • Yusuf Can Güneş</span>
                </div>
            </div>
            <div class="header-btns">
                <select id="ai-mode" class="mode-select" onchange="onModeChange()">
                    <option value="turbo">⚡ Turbo Mod (Hızlı & Net)</option>
                    <option value="coder">💻 Kod Modu (Mimar)</option>
                    <option value="security">🛡️ Siber Güvenlik Modu (Yasal Savunma)</option>
                </select>
                <button class="icon-btn" onclick="clearChat()"><i class="fa-solid fa-trash-can"></i> Temizle</button>
            </div>
        </div>

        <div id="chat-box">
            <div class="msg-row bot-row">
                <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="msg-content">Selam kanka! Ben <b>Güneş AI Ultra</b>. Yapımcım <b>Yusuf Can Güneş</b>. Bağlantı altyapısı güncellendi, artık modlarınla birlikte tamamen sorunsuz çalışıyor! 🚀</div>
            </div>
        </div>

        <div id="input-area">
            <input type="text" id="user-input" placeholder="Sorunu yaz, anında yanıtlayayım..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i> Gönder</button>
        </div>
    </div>

    <script>
        let chatHistory = [];

        function onModeChange() {
            const mode = document.getElementById('ai-mode').value;
            let text = "Turbo moda geçildi, direkt net cevaplar verilecek.";
            if (mode === 'coder') text = "Yazılım Mimar moduna geçildi, temiz kodlar yazılacak.";
            if (mode === 'security') text = "Siber Güvenlik (Savunma) moduna geçildi, zafiyet analizleri odaklı ilerliyoruz.";
            
            const chatBox = document.getElementById('chat-box');
            const noticeRow = document.createElement('div');
            noticeRow.className = 'msg-row bot-row';
            noticeRow.innerHTML = `<div class="msg-avatar"><i class="fa-solid fa-circle-info"></i></div><div class="msg-content"><i>${text}</i></div>`;
            chatBox.appendChild(noticeRow);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            if (!input) return;
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-box');

            // Kullanıcı mesajı
            const userRow = document.createElement('div');
            userRow.className = 'msg-row user-row';
            userRow.innerHTML = `<div class="msg-avatar"><i class="fa-solid fa-user"></i></div><div class="msg-content">${escapeHtml(message)}</div>`;
            chatBox.appendChild(userRow);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Yükleniyor göstergesi
            const loadingId = 'load-' + Date.now();
            const loadingRow = document.createElement('div');
            loadingRow.className = 'msg-row bot-row';
            loadingRow.id = loadingId;
            loadingRow.innerHTML = `<div class="msg-avatar"><i class="fa-solid fa-robot"></i></div><div class="msg-content"><i><i class="fa-solid fa-bolt fa-spin"></i> Yanıt alınıyor...</i></div>`;
            chatBox.appendChild(loadingRow);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Mod sistem talimatı
            const mode = document.getElementById('ai-mode').value;
            let systemPrompt = "Sen Güneş AI Ultra'sın. Yapımcın Yusuf Can Güneş. Türkçe yanıt ver.";

            if (mode === 'turbo') {
                systemPrompt = "Sen Güneş AI Ultra'nın Turbo Modusun. Yapımcın Yusuf Can Güneş. Gereksiz laf uzatmadan, en hızlı, net ve doğru kısa cevaplar ver.";
            } else if (mode === 'coder') {
                systemPrompt = "Sen Güneş AI Ultra'nın Kıdemli Yazılım Mimarısın. Yapımcın Yusuf Can Güneş. Kod isteklerinde en temiz, hatasız, modern ve yorum satırlı kod blokları üret.";
            } else if (mode === 'security') {
                systemPrompt = "Sen Güneş AI Ultra'nın Kıdemli Siber Güvenlik Uzmanısın. Yapımcın Yusuf Can Güneş. Tamamen yasal çerçevede; web güvenliği, şifreleme algoritmaları, zafiyet kapama (SQL Injection, XSS korumaları vb.) ve ağ savunma sistemleri hakkında profesyonel teknik destek sağla.";
            }

            try {
                // Alternatif ve engellenmeyen JSON POST köprüsü
                const response = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: message }
                        ],
                        model: "openai",
                        json: false
                    })
                });

                if (!response.ok) throw new Error("API yanıt vermedi");
                const reply = await response.text();

                document.getElementById(loadingId).remove();

                const botRow = document.createElement('div');
                botRow.className = 'msg-row bot-row';
                botRow.innerHTML = `<div class="msg-avatar"><i class="fa-solid fa-robot"></i></div><div class="msg-content">${marked.parse(reply)}</div>`;
                chatBox.appendChild(botRow);

                applyCodeBlocks();
            } catch (err) {
                // Eğer POST engellenirse akıllı GET yedek köprüsü devreye girer
                try {
                    const fallbackUrl = `https://text.pollinations.ai/${encodeURIComponent(systemPrompt + "\nSoru: " + message)}`;
                    const res2 = await fetch(fallbackUrl);
                    const reply2 = await res2.text();

                    document.getElementById(loadingId).remove();

                    const botRow = document.createElement('div');
                    botRow.className = 'msg-row bot-row';
                    botRow.innerHTML = `<div class="msg-avatar"><i class="fa-solid fa-robot"></i></div><div class="msg-content">${marked.parse(reply2)}</div>`;
                    chatBox.appendChild(botRow);

                    applyCodeBlocks();
                } catch (err2) {
                    document.getElementById(loadingId).remove();
                    const errRow = document.createElement('div');
                    errRow.className = 'msg-row bot-row';
                    errRow.innerHTML = `<div class="msg-avatar"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="msg-content">Bağlantı kurulamadı kanka. Tarayıcının eklentilerini (reklam engelleyici vb.) kontrol edebilir veya dosyayı tarayıcıya tam olarak kaydettiğinden emin olablirsin.</div>`;
                    chatBox.appendChild(errRow);
                }
            } finally {
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function clearChat() {
            document.getElementById('chat-box').innerHTML = `
                <div class="msg-row bot-row">
                    <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-content">Sohbet temizlendi kanka, yeni soruları alalım! ⚡</div>
                </div>`;
        }

        function applyCodeBlocks() {
            document.querySelectorAll('pre code').forEach((block) => {
                if (!block.parentElement.classList.contains('code-wrapper')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'code-wrapper';
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-code-btn';
                    copyBtn.innerHTML = 'Kopyala';
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(block.innerText);
                        copyBtn.innerHTML = 'Kopyalandı!';
                        setTimeout(() => copyBtn.innerHTML = 'Kopyala', 2000);
                    };
                    block.parentElement.parentNode.insertBefore(wrapper, block.parentElement);
                    wrapper.appendChild(copyBtn);
                    wrapper.appendChild(block.parentElement);
                    hljs.highlightElement(block);
                }
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
