<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güneş AI - Yapay Zeka Asistanı</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: rgba(18, 24, 41, 0.75);
            --border-color: rgba(56, 189, 248, 0.2);
            --user-gradient: linear-gradient(135deg, #2563eb, #1d4ed8);
            --bot-bg: rgba(30, 41, 59, 0.7);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center;
            align-items: center;
            height: 100vh; 
            padding: 15px; 
            overflow: hidden;
            position: relative;
        }

        /* Hareketli ve Işıltılı Arka Plan Efektleri */
        .bg-glow-1, .bg-glow-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.5;
            animation: floatGlow 10s infinite alternate ease-in-out;
        }

        .bg-glow-1 {
            background: #38bdf8;
            top: 10%;
            left: 15%;
        }

        .bg-glow-2 {
            background: #7c3aed;
            bottom: 10%;
            right: 15%;
            animation-delay: -5s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.2); }
        }

        /* Ana Kart / Cam Efekti */
        .chat-wrapper {
            position: relative;
            z-index: 10;
            max-width: 900px;
            width: 100%;
            height: 92vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 20px var(--accent-glow);
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            padding: 20px 28px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bot-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .bot-details h2 { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        .status { font-size: 13px; color: #34d399; display: flex; align-items: center; gap: 6px; font-weight: 400; }
        .status-dot { width: 9px; height: 9px; background-color: #34d399; border-radius: 50%; box-shadow: 0 0 8px #34d399; }

        .header-actions button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .header-actions button:hover { 
            background: rgba(239, 68, 68, 0.2); 
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5; 
        }

        /* Chat Kutusu */
        #chat-box { 
            flex: 1; 
            padding: 24px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            scroll-behavior: smooth;
        }

        .msg-row {
            display: flex;
            gap: 14px;
            max-width: 85%;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user-row { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot-row { align-self: flex-start; }

        .msg-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .user-row .msg-icon { background: var(--user-gradient); color: white; }
        .bot-row .msg-icon { background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid var(--border-color); }

        .msg-bubble { 
            padding: 16px 20px; 
            border-radius: 18px; 
            line-height: 1.6; 
            font-size: 15px;
            word-wrap: break-word; 
        }

        .user-row .msg-bubble { 
            background: var(--user-gradient); 
            color: #ffffff; 
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .bot-row .msg-bubble { 
            background-color: var(--bot-bg); 
            color: var(--text-main); 
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            white-space: pre-wrap;
        }

        /* Hızlı Sorular */
        .chips-container {
            display: flex;
            gap: 10px;
            padding: 0 24px 12px 24px;
            overflow-x: auto;
        }

        .chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .chip:hover { 
            border-color: var(--accent); 
            color: var(--accent); 
            background: rgba(56, 189, 248, 0.1);
            transform: translateY(-2px);
        }

        /* Input Alanı */
        #input-container { 
            display: flex; 
            gap: 12px; 
            padding: 20px 24px; 
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid var(--border-color);
        }

        input { 
            flex: 1; 
            padding: 16px 20px; 
            border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            background-color: rgba(30, 41, 59, 0.6); 
            color: #fff; 
            font-size: 15px; 
            font-family: inherit;
            outline: none; 
            transition: all 0.3s ease;
        }

        input:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 15px var(--accent-glow);
            background-color: rgba(30, 41, 59, 0.9);
        }

        button.send-btn { 
            padding: 0 26px; 
            border-radius: 14px; 
            border: none; 
            background: linear-gradient(135deg, #38bdf8, #2563eb); 
            color: #fff; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 16px; 
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        button.send-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Arka Plan Işıkları -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="chat-wrapper">
        <!-- Header -->
        <div class="chat-header">
            <div class="bot-info">
                <div class="avatar"><i class="fa-solid fa-sparkles"></i></div>
                <div class="bot-details">
                    <h2>Güneş AI</h2>
                    <span class="status"><span class="status-dot"></span> Çevrim içi (Gemini 1.5 Flash)</span>
                </div>
            </div>
            <div class="header-actions">
                <button onclick="clearChat()"><i class="fa-solid fa-rotate-right"></i> Temizle</button>
            </div>
        </div>

        <!-- Sohbet Alanı -->
        <div id="chat-box">
            <div class="msg-row bot-row">
                <div class="msg-icon"><i class="fa-solid fa-robot"></i></div>
                <div class="msg-bubble">Selam! Ben Güneş AI. Sana nasıl yardımcı olabilirim? 🚀</div>
            </div>
        </div>

        <!-- Öneri Butonları -->
        <div class="chips-container">
            <div class="chip" onclick="sendQuickMsg('Bana ilginç ve bilinmeyen bir bilgi ver!')">💡 İlginç Bir Bilgi</div>
            <div class="chip" onclick="sendQuickMsg('Komik bir espri yapabilir misin?')">😂 Espri Yap</div>
            <div class="chip" onclick="sendQuickMsg('Bana HTML/CSS ile güzel bir buton kodu yaz')">💻 Kod Örneği</div>
        </div>

        <!-- Mesaj Yazma Alanı -->
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Bir şeyler yaz..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // ===============================================================
        //  API ANAHTARINI BURAYA EKLİYORSUN:
        //  Google AI Studio'dan aldığın anahtarı (örn: AIzaSyD1234567890abcdef)
        //  ortadan ikiye bölüp ilk yarısını part1'e, kalanını part2'ye yaz!
        // ===============================================================
        
        const part1 = "AIzaSy_BURAYA_İLK_YARIYI_YAZ_"; 
        const part2 = "BURAYA_İKİNCİ_YARIYI_YAZ";
        
        const API_KEY = part1 + part2;
        
        let chatHistory = [];

        function sendQuickMsg(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        function clearChat() {
            chatHistory = [];
            document.getElementById('chat-box').innerHTML = `
                <div class="msg-row bot-row">
                    <div class="msg-icon"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-bubble">Sohbet sıfırlandı. Yeni bir soru sorabilirsin! ✨</div>
                </div>`;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-box');

            chatBox.innerHTML += `
                <div class="msg-row user-row">
                    <div class="msg-icon"><i class="fa-solid fa-user"></i></div>
                    <div class="msg-bubble">${escapeHtml(message)}</div>
                </div>`;
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Eğer varsayılan uyarı yazısı değiştirilmediyse uyarı ver
            if (part1.includes("BURAYA_İLK_YARIYI_YAZ")) {
                chatBox.innerHTML += `
                    <div class="msg-row bot-row">
                        <div class="msg-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                        <div class="msg-bubble">⚠️ <b>API Anahtarı Eksik!</b><br>Lütfen <code>index.html</code> dosyasını açıp <b>part1</b> ve <b>part2</b> kısımlarına kendi Google API anahtarını yapıştır.</div>
                    </div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                return;
            }

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div class="msg-row bot-row" id="${loadingId}">
                    <div class="msg-icon"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-bubble"><i>Düşünüyor...</i></div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            chatHistory.push({ role: "user", parts: [{ text: message }] });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: "Sen her konuda uzman, çok yetenekli, yardımsever, Türkçe konuşan modern bir yapay zekasın." }]
                        },
                        contents: chatHistory
                    })
                });

                const data = await response.json();
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const botReply = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `
                        <div class="msg-row bot-row">
                            <div class="msg-icon"><i class="fa-solid fa-robot"></i></div>
                            <div class="msg-bubble">${formatReply(botReply)}</div>
                        </div>`;
                    chatHistory.push({ role: "model", parts: [{ text: botReply }] });
                } else {
                    chatBox.innerHTML += `
                        <div class="msg-row bot-row">
                            <div class="msg-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                            <div class="msg-bubble">Bir yanıt alınamadı. API anahtarını doğru girdiğinden emin ol.</div>
                        </div>`;
                }

            } catch (err) {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();
                
                chatBox.innerHTML += `
                    <div class="msg-row bot-row">
                        <div class="msg-icon"><i class="fa-solid fa-circle-xmark"></i></div>
                        <div class="msg-bubble">Bağlantı hatası oluştu! İnternet bağlantını veya API anahtarını kontrol et.</div>
                    </div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatReply(text) {
            return text.replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
