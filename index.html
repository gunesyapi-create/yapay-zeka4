<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprise Secure Core - ZeroLog v3.5</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg-dark: #090d16;
            --panel-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Top Navigation Bar */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: var(--border-color);
            border: none;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-icon:active {
            background: var(--danger);
        }

        /* Main Workspace */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar for logs/metrics */
        sidebar {
            width: 260px;
            background-color: #0d1322;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
            font-size: 0.85rem;
        }

        @media(max-width: 768px) {
            sidebar { display: none; }
        }

        .metric-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
        }

        .metric-title {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-bottom: 4px;
        }

        .metric-value {
            font-weight: 600;
            color: var(--primary);
        }

        /* Chat / Console Area */
        .main-chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
        }

        .terminal-log {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .log-entry {
            max-width: 90%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-user {
            background-color: var(--primary);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .log-system {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            font-family: monospace;
        }

        /* Bottom Input Console */
        .input-dock {
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 12px;
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn-send {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-send:active {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="status-indicator" id="statusDot"></div>
            <span>ZERO-LOG KERNEL v3.5</span>
        </div>
        <div class="controls">
            <button class="btn-icon" onclick="CoreEngine.wipeMemory()">RAM'i Temizle</button>
            <button class="btn-icon" onclick="CoreEngine.exportDump()">Güvenli Döküm</button>
        </div>
    </header>

    <div class="workspace">
        <sidebar>
            <div class="metric-card">
                <div class="metric-title">OTURUM DURUMU</div>
                <div class="metric-value" id="sessionState">Ephemeral (Geçici)</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">XSS KORUMA FİLTRESİ</div>
                <div class="metric-value" style="color: var(--success);">Aktif (%100)</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">BELLEK TÜKETİMİ</div>
                <div class="metric-value" id="memoryUsage">~1.2 MB</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">DEPOLAMA TÜRÜ</div>
                <div class="metric-value">SessionStorage (Sıfır İz)</div>
            </div>
        </sidebar>

        <div class="main-chat-area">
            <div class="terminal-log" id="terminalLog">
                <div class="log-entry log-system">[SYSTEM] Çekirdek başarıyla başlatıldı. Tarayıcı kapatıldığı an tüm izler tamamen imha edilecektir.</div>
            </div>

            <div class="input-dock">
                <div class="input-wrapper">
                    <input type="text" id="commandInput" placeholder="Komut veya mesaj girin..." autocomplete="off">
                </div>
                <button class="btn-send" onclick="CoreEngine.executeCommand()">Gönder</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Devasa Mimari & Güvenlik Motoru (Single-File Framework Core)
         */
        class SecurityCore {
            constructor() {
                this.logContainer = document.getElementById('terminalLog');
                this.inputField = document.getElementById('commandInput');
                this.initListeners();
                this.loadSessionState();
            }

            // XSS ve Script Enjeksiyon Engelleme Katmanı
            sanitize(input) {
                const element = document.createElement('div');
                element.innerText = input;
                return element.innerHTML;
            }

            // Komut Çalıştırma ve İşleme Modülü
            executeCommand() {
                const rawValue = this.inputField.value.trim();
                if (!rawValue) return;

                const safeText = this.sanitize(rawValue);
                this.appendLog(safeText, 'user');
                this.inputField.value = '';

                // Simüle edilmiş akıllı güvenlik yanıtı
                setTimeout(() => {
                    let response = "Güvenli İşlem Tamamlandı: " + safeText;
                    if (safeText.toLowerCase() === 'help') {
                        response = "Kullanılabilir Komutlar: wipe, status, clear, date";
                    } else if (safeText.toLowerCase() === 'wipe') {
                        this.wipeMemory();
                        return;
                    }
                    this.appendLog(response, 'system');
                }, 300);
            }

            appendLog(text, sender) {
                const entry = document.createElement('div');
                entry.className = `log-entry ${sender === 'user' ? 'log-user' : 'log-system'}`;
                entry.textContent = text;
                this.logContainer.appendChild(entry);
                this.logContainer.scrollTop = this.logContainer.scrollHeight;
                this.persistSession();
            }

            // RAM ve Oturum Temizleme Motoru
            wipeMemory() {
                sessionStorage.clear();
                this.logContainer.innerHTML = '<div class="log-entry log-system">[WARN] Tüm bellek ve oturum verileri güvenli bir şekilde sıfırlandı.</div>';
                document.getElementById('sessionState').innerText = "Temizlendi";
                document.getElementById('sessionState').style.color = "var(--danger)";
            }

            // Yalnızca Sekme Ömrü Olan Oturum Belleği Yönetimi
            persistSession() {
                try {
                    sessionStorage.setItem('kernel_dump', this.logContainer.innerHTML);
                } catch (e) {
                    console.error("Bellek kotası aşıldı.");
                }
            }

            loadSessionState() {
                const saved = sessionStorage.getItem('kernel_dump');
                if (saved) {
                    this.logContainer.innerHTML = saved;
                    this.logContainer.scrollTop = this.logContainer.scrollHeight;
                }
            }

            exportDump() {
                const content = this.logContainer.innerText;
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'secure-dump-' + Date.now() + '.log';
                a.click();
                URL.revokeObjectURL(url);
            }

            initListeners() {
                this.inputField.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.executeCommand();
                    }
                });
            }
        }

        // Çekirdeği Ateşle
        const CoreEngine = new SecurityCore();
    </script>
</body>
</html>
