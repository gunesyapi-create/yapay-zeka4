<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güneş AI Ultra - Turbo Hız</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-dark: #020617;
            --card-bg: rgba(15, 23, 42, 0.98);
            --card-border: rgba(56, 189, 248, 0.4);
            --accent-cyan: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; padding: 10px; overflow: hidden;
        }

        .chat-container {
            max-width: 950px; width: 100%; height: 96vh;
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; display: flex; flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 25px rgba(56, 189, 248, 0.2);
            overflow: hidden;
        }

        .chat-header {
            padding: 14px 20px; background: #0b0f19;
            border-bottom: 1px solid var(--card-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .bot-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; color: #fff; }
        .bot-brand i { color: var(--accent-cyan); font-size: 20px; }

        .header-controls { display: flex; gap: 8px; align-items: center; }
        .mode-select, .icon-btn {
            background: #1e293b; border: 1px solid var(--accent-cyan); color: var(--accent-cyan);
            padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; outline: none;
        }
        .icon-btn { color: #f8fafc; border-color: rgba(255,255,255,0.2); }
        .icon-btn:hover { background: rgba(56, 189, 248, 0.2); }

        #chat-box {
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
        }

        .msg-row { display: flex; gap: 10px; max-width: 85%; }
        .msg-row.user-row { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot-row { align-self: flex-start; }

        .msg-content {
            padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.5; word-wrap: break-word; user-select: text;
        }
        .user-row .msg-content { background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
        .bot-row .msg-content { background: #1e293b; color: #f8fafc; border-bottom-left-radius: 2px; border: 1px solid rgba(255,255,255,0.08); }

        #input-area {
            display: flex; gap: 10px; padding: 12px 16px; background: #0b0f19; border-top: 1px solid var(--card-border);
        }
        input[type="text"] {
            flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            background: #1e293b; color: #fff; font-size: 14px; outline: none; user-select: text;
        }
        input[type="text"]:focus { border-color: var(--accent-cyan); }
        button.send-btn {
            padding: 0 20px; border-radius: 10px; border: none; background: var(--accent-cyan);
            color: #020617; font-weight: 700; cursor: pointer; font-size: 14px;
        }
        button.send-btn:hover { opacity: 0.9; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="bot-brand">
                <i class="fa-solid fa-bolt"></i> Güneş AI Ultra
            </div>
            <div class="header-controls">
                <select id="ai-mode" class="mode-select">
                    <option value="turbo">⚡ Turbo (Işık Hızı)</option>
                    <option value="coder">💻 Kod Mimarı</option>
                    <option value="security">🛡️ Siber Güvenlik</option>
                </select>
                <button class="icon-btn" onclick="clearChat()"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>

        <div id="chat-box">
            <div class="msg-row bot-row">
                <div class="msg-content">Hızlı ve temiz mod aktif kanka! Yaz gönder, anında cevaptayım. 🚀</div>
            </div>
        </div>

        <div id="input-area">
            <input type="text" id="user-input" placeholder="Hızlıca yaz..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-box');

            // Kullanıcı Mesajı
            const userRow = document.createElement('div');
            userRow.className = 'msg-row user-row';
            userRow.innerHTML = `<div class="msg-content">${escapeHtml(message)}</div>`;
            chatBox.appendChild(userRow);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Yükleniyor
            const loadId = 'l-' + Date.now();
            const loadRow = document.createElement('div');
            loadRow.className = 'msg-row bot-row';
            loadRow.id = loadId;
            loadRow.innerHTML = `<div class="msg-content"><i class="fa-solid fa-spinner fa-spin"></i> Yazılıyor...</div>`;
            chatBox.appendChild(loadRow);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Mod Kuralı
            const mode = document.getElementById('ai-mode').value;
            let prompt = `Yusuf Can Güneş'in asistanısın. Türkçe yanıt ver: ${message}`;
            if (mode === 'coder') prompt = `Yusuf Can Güneş'in yazılım mimarısın. Temiz kod yaz. Soru: ${message}`;
            if (mode === 'security') prompt = `Yusuf Can Güneş'in siber güvenlik uzmanısın. Yasal savunma odaklı yanıtla: ${message}`;

            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                const reply = await res.text();

                document.getElementById(loadId).remove();

                const botRow = document.createElement('div');
                botRow.className = 'msg-row bot-row';
                botRow.innerHTML = `<div class="msg-content">${marked.parse(reply)}</div>`;
                chatBox.appendChild(botRow);
            } catch (e) {
                document.getElementById(loadId).remove();
                const errRow = document.createElement('div');
                errRow.className = 'msg-row bot-row';
                errRow.innerHTML = `<div class="msg-content" style="color:#f87171;">Hata oluştu, tekrar dene kanka.</div>`;
                chatBox.appendChild(errRow);
            } finally {
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function clearChat() {
            document.getElementById('chat-box').innerHTML = `<div class="msg-row bot-row"><div class="msg-content">Temizlendi!</div></div>`;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
