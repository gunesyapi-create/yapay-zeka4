<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kendi Yapay Zekam</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #1e1e2e; color: #cdd6f4; display: flex; flex-direction: column; height: 100vh; padding: 20px; }
        h1 { text-align: center; color: #89b4fa; margin-bottom: 15px; font-size: 22px; }
        #chat-box { flex: 1; border: 1px solid #45475a; border-radius: 12px; padding: 15px; overflow-y: auto; background-color: #181825; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 10px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .user { background-color: #89b4fa; color: #11111b; align-self: flex-end; font-weight: 500; }
        .bot { background-color: #313244; color: #cdd6f4; align-self: flex-start; white-space: pre-wrap; }
        #input-container { display: flex; gap: 10px; margin-top: 15px; }
        input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #45475a; background-color: #313244; color: #fff; font-size: 15px; outline: none; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background-color: #89b4fa; color: #11111b; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:hover { background-color: #b4befe; }
    </style>
</head>
<body>
    <h1>🚀 Gemini Web Asistanı</h1>
    <div id="chat-box"></div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Soru sor..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="msg user"><b>Sen:</b> ${message}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="msg bot" id="${loadingId}"><i>Düşünüyor...</i></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await res.json();
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="msg bot"><b>Yapay Zeka:</b><br>${data.reply}</div>`;
            } catch (err) {
                document.getElementById(loadingId).innerText = 'Hata oluştu!';
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
